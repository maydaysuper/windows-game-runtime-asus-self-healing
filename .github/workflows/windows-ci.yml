name: windows-ci

on:
  push:
    branches: [ main, master, 'feature/**', 'release/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  winui-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PROJECT: WindowsGameRuntimeASUSSelfHealing.WinUI/WindowsGameRuntimeASUSSelfHealing.WinUI.csproj
      RUNTIME: win-x64
      CONFIGURATION: Release
      PLATFORM: x64
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Quick reference and UTF-8 BOM check
        shell: powershell
        run: |
          ./tools/Check-FileReferences.ps1
          ./tools/Ensure-BOM.ps1 -Verify

      - name: Source capability / no-regression invariants
        shell: powershell
        run: python ./Tests/source_invariants.py

      - name: PowerShell parser, architecture and hash-lock tests
        shell: powershell
        run: ./Tests/Architecture.Tests.ps1

      - name: Engine import regression (Windows PowerShell 5.1)
        shell: powershell
        run: ./Tests/EngineImport.Smoke.ps1 -Backend "$PWD/WindowsGameRuntimeASUSSelfHealing.WinUI/Backend" -Scratch "$env:RUNNER_TEMP/WgrImportSmoke"

      - name: Pester unit tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })){
            Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.0.0 -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'Tests/Unit'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - name: Restore
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path BuildLogs -Force | Out-Null
          dotnet restore $env:PROJECT -r $env:RUNTIME --nologo -p:Platform=$env:PLATFORM `
            "-flp:logfile=BuildLogs/Restore_${{ github.run_id }}.log;verbosity=normal" `
            -bl:BuildLogs/Restore_${{ github.run_id }}.binlog
          dotnet restore Tests/WGR.Tests/WGR.Tests.csproj -r $env:RUNTIME --nologo -p:Platform=$env:PLATFORM

      - name: Build WPF
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path BuildLogs -Force | Out-Null
          dotnet build $env:PROJECT -c $env:CONFIGURATION -r $env:RUNTIME --no-restore --nologo `
            -p:Platform=$env:PLATFORM -p:ContinuousIntegrationBuild=true `
            "-flp:logfile=BuildLogs/Build_${{ github.run_id }}.log;verbosity=normal" `
            -bl:BuildLogs/Build_${{ github.run_id }}.binlog

      - name: .NET unit tests (registry backup / shader idempotency)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          dotnet test Tests/WGR.Tests/WGR.Tests.csproj -c $env:CONFIGURATION --nologo `
            -p:Platform=$env:PLATFORM --runtime $env:RUNTIME

      - name: Publish self-contained WPF
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path BuildLogs -Force | Out-Null
          dotnet publish $env:PROJECT -c $env:CONFIGURATION -r $env:RUNTIME `
            -o artifacts/publish --self-contained true --no-restore --nologo `
            -p:Platform=$env:PLATFORM -p:ContinuousIntegrationBuild=true `
            -p:SelfContained=true -p:PublishSingleFile=false `
            -p:PublishTrimmed=false -p:PublishReadyToRun=false `
            "-flp:logfile=BuildLogs/Publish_${{ github.run_id }}.log;verbosity=normal" `
            -bl:BuildLogs/Publish_${{ github.run_id }}.binlog

      - name: Show MSBuild compiler errors
        if: failure()
        shell: powershell
        run: ./Tests/Show-MsBuildErrors.ps1 -LogRoot BuildLogs

      - name: Materialize hash-locked Backend
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src = Join-Path $PWD 'WindowsGameRuntimeASUSSelfHealing.WinUI\Backend'
          $dst = Join-Path $PWD 'artifacts\publish\Backend'
          if(-not (Test-Path -LiteralPath $src)) { throw "Source Backend missing: $src" }
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Get-ChildItem -LiteralPath $src -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $dst $_.Name) -Force
          }
          $count = @(Get-ChildItem -LiteralPath $dst -File).Count
          if($count -lt 12) { throw "Materialize hash-locked Backend produced too few files: $count" }
          Write-Host "Materialized hash-locked Backend next to published EXE ($count files). Folder deploy must keep RepairCenter on disk."

      - name: Validate published runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exe='artifacts/publish/WindowsGameRuntimeASUSSelfHealing.WinUI.exe'
          if(-not (Test-Path -LiteralPath $exe)) { throw "Published EXE missing: $exe" }
          foreach($required in @(
            'artifacts/publish/Backend/RepairCenter.ps1',
            'artifacts/publish/Backend/ElevatedBroker.ps1',
            'artifacts/publish/Backend/CapabilityBaseline.json',
            'artifacts/publish/wpfgfx_cor3.dll',
            'artifacts/publish/PresentationNative_cor3.dll',
            'artifacts/publish/e_sqlite3.dll'
          )) {
            if(-not (Test-Path -LiteralPath $required)) { throw "Published runtime file missing: $required" }
          }
          $dllCount=@(Get-ChildItem -LiteralPath 'artifacts/publish' -Filter '*.dll' -File).Count
          if($dllCount -lt 8) { throw "Published payload looks like PublishSingleFile (dllCount=$dllCount)" }
          Write-Host "Self-contained WPF runtime beside EXE (dllCount=$dllCount)"

      - name: Verify published payload trust chain
        shell: powershell
        run: ./Installer/Verify-PublishPayload.ps1 -PublishRoot artifacts/publish

      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Find-Iscc {
            @(
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          }
          $found = Find-Iscc
          if(-not $found) {
            $winget=Get-Command winget.exe -ErrorAction SilentlyContinue
            if($winget -and $winget.Source -and (Test-Path -LiteralPath $winget.Source)) {
              & $winget.Source install --id JRSoftware.InnoSetup.7 --exact --source winget --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
            }
            $found = Find-Iscc
          }
          if(-not $found) {
            choco install innosetup --no-progress -y
            $found = Find-Iscc
          }
          if(-not $found) { throw 'ISCC not found after Inno Setup install.' }
          Write-Host "ISCC: $found"

      - name: Build release artifacts (launcher + App folder Portable + desktop-shortcut Setup)
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./Build-Release.ps1 -PublishRoot artifacts/publish -ReleaseDir artifacts/release
          $utf8=New-Object System.Text.UTF8Encoding($false,$true)
          $build=([IO.File]::ReadAllText((Resolve-Path 'WindowsGameRuntimeASUSSelfHealing.WinUI/Backend/BuildInfo.json'),$utf8) | ConvertFrom-Json)
          "version=$($build.Version)" >> $env:GITHUB_OUTPUT

      - name: Verify release SHA256
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $list = Join-Path 'artifacts/release' 'RELEASE_SHA256.txt'
          if(-not (Test-Path -LiteralPath $list)) { throw 'RELEASE_SHA256.txt missing' }
          Get-Content -LiteralPath $list | Where-Object { $_ -match '^[0-9a-f]{64}\s+\S+' } | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            $path = Join-Path 'artifacts/release' $name.Trim()
            if(-not (Test-Path -LiteralPath $path)) { throw "Release file missing: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne $hash.ToLowerInvariant()) { throw "SHA256 mismatch for $name" }
            Write-Host "[PASS] $name"
          }
          $setup = Get-Item 'artifacts/release/*Setup*_x64.exe' | Select-Object -First 1
          if(-not $setup) { throw 'Setup EXE missing' }
          $ver = [Diagnostics.FileVersionInfo]::GetVersionInfo($setup.FullName).FileVersion
          if($ver -ne '${{ steps.package.outputs.version }}.0') { throw "Unexpected FileVersion: $ver" }
          Write-Host "[PASS] Setup FileVersion=$ver"

      - name: E2E unzip portable and --version
        shell: powershell
        run: ./Tests/E2E/Verify-ReleaseLayout.ps1 -ReleaseDir artifacts/release

      - name: E2E legacy Python Qt installer upgrade
        shell: powershell
        run: ./Tests/E2E/Verify-LegacyUpgrade.ps1 -ReleaseDir artifacts/release

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WGR-ASUS-SelfHealing-v${{ steps.package.outputs.version }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ steps.package.outputs.version }}
          name: Windows Game Runtime / ASUS Self-Healing v${{ steps.package.outputs.version }}
          files: artifacts/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

      - name: Upload publish diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WGR-ASUS-SelfHealing-build-diagnostics
          path: |
            **/*.binlog
            **/BuildLogs/**
          if-no-files-found: ignore
          retention-days: 7
